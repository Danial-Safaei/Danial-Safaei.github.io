name: Update Scholar metrics

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Scholar rate-limits datacentre IPs; scholarly can retry for a long time.
    # Bound the job so a blocked scrape costs minutes, not hours - the site
    # simply keeps its committed data until the next weekly attempt.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scholarly
        run: pip install --quiet scholarly

      - name: Refresh data/scholar.json
        run: python scripts/update_scholar.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet data/scholar.json; then
            git config user.name "scholar-bot"
            git config user.email "actions@github.com"
            git add data/scholar.json
            git commit -m "chore: refresh Scholar metrics ($(date -u +%F))"
            git push
          else
            echo "No changes to commit."
          fi
