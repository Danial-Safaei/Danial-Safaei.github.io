<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="description" content="The page you were looking for could not be found.">
    <meta name="color-scheme" content="light dark">

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) { document.body.classList.add("dark"); }
            } catch (e) { /* keep the light default */ }
        })();
    </script>

    <header class="site-header">
        <div class="wrap masthead">
            <a class="brand" href="/">Danial Safaei</a>
            <nav class="nav" aria-label="Primary">
                <a href="/#research">Research</a>
                <a href="/#publications">Publications</a>
                <a href="/blog.html">Writing</a>
                <a href="/cv.html">CV</a>
                <a href="/#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="notfound">
            <div>
                <p class="label">Error 404</p>
                <h1>Page not found</h1>
                <p>The page you are looking for does not exist, or it has moved.</p>
                <div class="hero-actions">
                    <a class="btn btn-primary" href="/">Home</a>
                    <a class="btn" href="/#publications">Publications</a>
                    <a class="btn" href="/blog.html">Writing</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <div class="footer-row">
                <p>&copy; <span id="year">2026</span> Danial Safaei</p>
                <p>WMG, University of Warwick · Coventry, UK</p>
            </div>
        </div>
    </footer>

    <script src="/interact.js"></script>
</body>
</html>
